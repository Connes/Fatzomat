name: Refresh Flutter lockfile

on:
  push:
    branches: ["ci/quality-gates"]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Regenerate lockfile
        run: flutter pub get
      - name: Commit lockfile
        run: |
          if git diff --quiet -- pubspec.lock; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "build: refresh Flutter lockfile"
          git push

# One-time bootstrap workflow; remove after lockfile refresh.
