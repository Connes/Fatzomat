name: Retry failed quality gate

on:
  workflow_run:
    workflows:
      - Flutter quality gate
    types:
      - completed

permissions:
  actions: write

jobs:
  retry:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure'
        && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Retry failed quality jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$RUN_ID" --failed --repo "${{ github.repository }}"
