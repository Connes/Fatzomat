name: Temporary source package 1.13.46

on:
  push:
    branches: ["ci/quality-gates"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create clean source ZIP
        run: |
          set -euo pipefail
          rm -rf .git .dart_tool build android/ci-upload.jks android/key.properties
          rm -f .github/workflows/source-package-1.13.46.yml
          mkdir -p /tmp/package
          zip -qr "/tmp/package/Schmackofatz_v1.13.46+258_FINAL.zip" .
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: schmackofatz-source-1.13.46-final
          path: /tmp/package/Schmackofatz_v1.13.46+258_FINAL.zip
          if-no-files-found: error
          retention-days: 1
