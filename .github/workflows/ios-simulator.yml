name: iPhone simulator smoke test

on:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/ios-simulator.yml"
  pull_request:
    branches:
      - main
    paths:
      - "ios/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/ios-simulator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator:
    name: Build and launch iPhone simulator app
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build iOS simulator app
        run: flutter build ios --simulator --debug --no-codesign

      - name: Verify simulator app bundle
        run: test -d build/ios/iphonesimulator/Runner.app


      - name: Boot an available iPhone simulator
        id: simulator
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for group in data["devices"].values() for d in group if d["name"].startswith("iPhone")]; print(devices[0]["udid"] if devices else "")')"
          test -n "$DEVICE_ID"
          echo "udid=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Install and launch app in iPhone simulator
        run: |
          set -euo pipefail
          DEVICE_ID="${{ steps.simulator.outputs.udid }}"
          APP_PATH="build/ios/iphonesimulator/Runner.app"
          BUNDLE_ID="com.example.food_app_mvp"

          for attempt in 1 2 3; do
            echo "Simulator install/launch attempt ${attempt}/3"
            STATE="$(xcrun simctl list devices | grep "$DEVICE_ID" | sed -E 's/.*\(([A-F0-9-]+)\) \(([^)]*)\).*/\2/' | head -n 1)"
            if [ "$STATE" != "Booted" ]; then
              xcrun simctl boot "$DEVICE_ID" || true
            fi

            if xcrun simctl bootstatus "$DEVICE_ID" -b &&
               xcrun simctl install "$DEVICE_ID" "$APP_PATH" &&
               xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"; then
              echo "App installed and launched successfully."
              exit 0
            fi

            echo "Simulator attempt ${attempt} failed; restarting simulator before retry."
            xcrun simctl shutdown "$DEVICE_ID" || true
            if [ "$attempt" -lt 3 ]; then
              sleep 5
              xcrun simctl boot "$DEVICE_ID" || true
            fi
          done

          echo "Unable to install and launch the app after 3 simulator attempts."
          exit 1
