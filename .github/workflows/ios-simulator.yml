name: iPhone simulator smoke test

on:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/ios-simulator.yml"
  pull_request:
    branches:
      - main
    paths:
      - "ios/**"
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/ios-simulator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator:
    name: Build and launch iPhone simulator app
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build iOS simulator app
        run: flutter build ios --simulator --debug --no-codesign

      - name: Verify simulator app bundle
        run: test -d build/ios/iphonesimulator/Runner.app


      - name: Boot an available iPhone simulator
        id: simulator
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for group in data["devices"].values() for d in group if d["name"].startswith("iPhone")]; print(devices[0]["udid"] if devices else "")')"
          test -n "$DEVICE_ID"
          echo "udid=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Install and launch app in iPhone simulator
        run: |
          xcrun simctl install "${{ steps.simulator.outputs.udid }}" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "${{ steps.simulator.outputs.udid }}" com.example.food_app_mvp
