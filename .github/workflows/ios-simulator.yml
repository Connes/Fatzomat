name: iOS simulator build

on:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/ios-simulator.yml"
  pull_request:
    branches:
      - main
    paths:
      - "ios/**"
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/ios-simulator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator:
    name: Build iPhone simulator app
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build iOS simulator app
        run: flutter build ios --simulator --debug --no-codesign

      - name: Verify simulator app bundle
        run: test -d build/ios/iphonesimulator/Runner.app
