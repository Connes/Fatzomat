name: Flutter quality gate

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Repository hygiene
        run: bash scripts/check_repository.sh

      - name: Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate Schmackofatz app icon
        run: flutter pub run flutter_launcher_icons --file flutter_launcher_icons.yaml

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # CI only needs to validate compilation. Real Firebase configuration is
      # intentionally not committed to the repository.
      - name: Prepare placeholder Firebase config for debug build
        run: |
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "fatzomat-ci",
              "storage_bucket": "fatzomat-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.example.food_app_mvp"
                  }
                },
                "api_key": [
                  { "current_key": "ci-placeholder-not-for-runtime" }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Build Android debug APK
        run: flutter build apk --debug
