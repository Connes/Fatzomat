name: Flutter quality gate

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Repository hygiene
        run: bash scripts/check_repository.sh

      - name: Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate Schmackofatz app icon
        run: flutter pub run flutter_launcher_icons --file flutter_launcher_icons.yaml

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
