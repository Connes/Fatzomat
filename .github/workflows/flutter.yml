name: Flutter quality gate

on:
  push:
    branches: ["main", "develop", "ci/quality-gates"]
  workflow_dispatch:

concurrency:
  group: flutter-quality
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Verify repository hygiene
        run: bash scripts/check_repository.sh
      - name: Verify reproducible dependency state
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Repair Android SDK toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "cmake;3.22.1"
      - name: Build Android debug artifact
        run: flutter build apk --debug
      - name: Configure temporary CI release signing
        run: |
          keytool -genkeypair -v \
            -keystore android/ci-upload.jks \
            -storepass changeit \
            -keypass changeit \
            -alias ci-upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=Schmackofatz CI, OU=CI, O=Schmackofatz, C=DE"
          cat > android/key.properties <<'EOF'
          storeFile=ci-upload.jks
          storePassword=changeit
          keyAlias=ci-upload
          keyPassword=changeit
          EOF
      - name: Build Android release configuration check
        env:
          SUPABASE_URL: https://ci.invalid.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: >-
          flutter build apk --release
          --dart-define=SUPABASE_URL=$SUPABASE_URL
          --dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: schmackofatz-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
