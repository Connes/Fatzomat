name: source-package-1.13.44

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/schmackofatz-source
          mkdir -p /tmp/schmackofatz-source
          git archive --format=tar HEAD | tar -x -C /tmp/schmackofatz-source
          rm -f /tmp/schmackofatz-source/.github/workflows/source-package-1.13.44.yml
          cd /tmp/schmackofatz-source
          zip -qr /tmp/Schmackofatz_v1.13.44+256_FINAL.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: schmackofatz-source-1.13.44-final
          path: /tmp/Schmackofatz_v1.13.44+256_FINAL.zip
          if-no-files-found: error
